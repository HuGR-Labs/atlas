# Product build gate. Gate implementations live in harness/ (Orchestra-bound).
# Runs on push + pull_request. The bar Orchestra enforces on seats is enforced here.
name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run godfile-guard  # ≤400-LOC ceiling per source file (harness/gates)
      - run: npm run typecheck       # tsc -b — strict, downward-only layers (also builds dist/)
      - run: npm run layer-guard     # ARCH-1..7 fitness function: layer direction, acyclicity, leg binding, surface budget
      - run: npm run reference-model-guard  # every zero-production-caller module is DECLARED, not discovered
      - run: npm run spec-conformance-guard  # shipped surface == specs; no governance-count drift; property pins fresh
      - run: npm run id-integrity    # docs id graph: unique definitions, no dangling citation/anchor, no orphan REQ/SCN, links resolve
      - run: npm run command-doc-guard  # every shipped CLI command has a reference page, and vice versa
      - run: npm run adr-citation-guard  # every ADR-NNNN cited under docs/ resolves to docs/adr/ADR-NNNN-*.md
      - run: npm run doc-transcript-guard  # every documented command transcript is re-run against the built binary, or named as unverifiable
      - run: npm test                # vitest run — own-suite + held-out GATE + totality fences
